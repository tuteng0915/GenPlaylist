checkpoint_every_n_steps:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  monitor: null
  save_top_k: -1  # keep every periodic checkpoint; there is no validation split
  save_last: True # save model as ${save_dir}/checkpoints/last.ckpt
  dirpath: ${checkpointing.save_dir}/checkpoints
  filename: 'step-{step}'
  verbose: True
  auto_insert_metric_name: False
  every_n_train_steps: 500  # 每500步保存一次（而不是10步）
